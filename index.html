function applyRemote(d){
  if(!d) return;
  _remote = true;
  state.group = d.group || {};
  state.flag  = d.flag  || {};
  state.done  = d.done  || {};
  state.closing = d.closing ?? null;
  state.bal = d.bal || null;
  state.pairSeen = d.pairSeen || {};
  const seedIds = new Set(SEED.tx.map((_,i)=>'t'+i));
  state.tx = state.tx.filter(t=>seedIds.has(t.id)).concat(d.tx||[]);
  _remote = false;
  render();

let _auth = null;

function login(){
  if(!_auth) return;
  const p = new GoogleAuthProvider();
  p.setCustomParameters({ prompt:'select_account' });
  signInWithPopup(_auth, p).catch(e=>{
    // Safari trên iPhone hay chặn popup → chuyển sang mở thẳng
    if(/popup|blocked|cancelled/i.test(e.code||'')) signInWithRedirect(_auth, p);
    else setSync('lỗi đăng nhập: '+e.code);
  });
}
window.dtLogin  = login;
window.dtLogout = ()=>_auth && signOut(_auth);

(function connect(){
  if (!FIREBASE.apiKey){ setSync('chưa nối Firebase'); return; }
  try {
    const app = initializeApp(FIREBASE);
    _db = getFirestore(app, DB_NAME);
    _auth = getAuth(app);
    getRedirectResult(_auth).catch(()=>{});
    onAuthStateChanged(_auth, u=>{
      if(!u){ _uid=null; setSync('chưa đăng nhập'); render(); return; }
      _uid = u.uid; setSync('đang đồng bộ…'); render();
      onSnapshot(doc(_db, ...DOC_PATH(_uid)),
        snap=>{ applyRemote(snap.data()); setSync('đã đồng bộ · '+(u.email||'')); },
        err=>setSync('lỗi: '+err.code));
    });
  } catch(e){ setSync('lỗi khởi tạo'); }
})();

/* --- phân nhóm: gán tay > ghim > brand > tên người > Khác --- */
const isPerson = n => !/[0-9*@#\/]/.test(n) && !/[a-z]/.test(n)
  && !/\b(CTCP|CTY|CONG TY|TNHH|JOINT|STOCK|COMPANY|JSC)\b/i.test(n)
  && n.split(/\s+/).length >= 2 && n.split(/\s+/).length <= 5;

function groupOf(t){
  if (state.group[t.id]) return state.group[t.id];
  const up = t.name.trim().toUpperCase();
  if (PINNED[up]) return PINNED[up];
  if (t.name === 'Grab') {
    if (t.amount <= GRAB_BANDS.rideMax) return 'Đi lại';
    if (t.amount >= GRAB_BANDS.foodMin) return 'Ăn uống';
    return null;                                   // khúc giữa → đại ca duyệt
  }
  if (t.name in BRAND_GROUP) return BRAND_GROUP[t.name];
  for (const [re,g] of BRAND_RULES) if (re.test(t.name)) return g;
  if (isPerson(t.name)) return 'Cá nhân';
  if (/^Tiền chuyển (ra|vào)$/i.test(t.name)) return 'Khác';
  return 'Khác';
}
const needsPick = t => t.kind==='expense' && !groupOf(t);

/* --- lịch trả nợ SC --- */
function loanState(today = new Date()){
  const r = LOAN.annualRate/12;
  const pay = LOAN.principal*r/(1-Math.pow(1+r,-LOAN.months));
  const first = new Date(LOAN.firstDue);
  let n = (today.getFullYear()-first.getFullYear())*12 + (today.getMonth()-first.getMonth());
  if (today.getDate() >= first.getDate()) n += 1;
  n = Math.max(0, Math.min(LOAN.months, n));
  let bal = LOAN.principal, interest = 0, principalPart = 0;
  for (let i=0;i<n;i++){ interest = bal*r; principalPart = pay-interest; bal -= principalPart; }
  return { paid:n, left:LOAN.months-n, balance:Math.max(0,bal), pay, interest, principalPart,
           endDate:new Date(first.getFullYear(), first.getMonth()+LOAN.months-1, first.getDate()) };
}

/* --- tìm bản ghi trùng đã nằm trong sổ ---
   Cùng ngày, cùng số tiền, cùng nguồn thì chỉ giữ một.
   Ưu tiên giữ bản có sẵn trong app, xoá bản nhập từ ảnh. */
function dupExtras(){
  const groups={};
  state.tx.forEach(t=>{
    const k=t.date+'|'+t.amount+'|'+t.src;
    (groups[k]=groups[k]||[]).push(t);
  });
  const extras=[];
  Object.values(groups).forEach(g=>{
    if(g.length<2) return;
    /* CHỈ dọn khi có một bản có sẵn trong app và một bản nhập từ ảnh.
       Hai dòng cùng nhập từ ảnh thì để yên — ngân hàng có thể ghi
       hai giao dịch thật cùng ngày cùng số tiền, không phân biệt được. */
    const seeds = g.filter(t=>!t.id.startsWith('i'));
    if(!seeds.length) return;
    const imported = g.filter(t=>t.id.startsWith('i'));
    imported.slice(0, seeds.length).forEach(t=>extras.push(t));
  });
  return extras;
}

/* --- tìm cặp bù trừ: ứng tiền rồi được trả lại --- */
function offsetPairs(){
  const pairs=[], used=new Set();
  const list=state.tx.filter(t=>t.kind==='expense'||t.kind==='income');
  for(const a of list){
    if(used.has(a.id) || a.kind!=='expense') continue;
    const b=list.find(x=>!used.has(x.id) && x.id!==a.id && x.kind==='income'
      && x.amount===a.amount
      && x.name.trim().toUpperCase()===a.name.trim().toUpperCase()
      && Math.abs(new Date(x.date)-new Date(a.date))/864e5 <= OFFSET_DAYS);
    if(b){ used.add(a.id); used.add(b.id); pairs.push([a,b]); }
  }
  return pairs;
}
const offsetIds = () => {
  const s=new Set();
  if(state.keepPairs) return s;
  offsetPairs().forEach(([a,b])=>{ s.add(a.id); s.add(b.id); });
  return s;
};

/* --- tổng hợp --- */
function inMonth(t, m){ return String(t.date).slice(0,7) === (m||state.month); }
const prevMonth = m => { const [y,mm]=(m||state.month).split('-').map(Number);
  return mm===1 ? `${y-1}-12` : `${y}-${String(mm-1).padStart(2,'0')}`; };

/* tổng theo nhóm của một tháng bất kỳ — dùng cho phần so sánh */
function groupTotals(m){
  const off=offsetIds(), r={};
  state.tx.filter(t=>t.kind==='expense' && inMonth(t,m) && !off.has(t.id))
    .forEach(t=>{ const g=groupOf(t)||'Chờ gán'; r[g]=(r[g]||0)+t.amount; });
  return r;
}

function summary(){
  const off = offsetIds();
  const ex = state.tx.filter(t=>t.kind==='expense' && inMonth(t));
  const byGroup = {};
  ex.forEach(t=>{
    const g = groupOf(t) || 'Chờ gán';
    (byGroup[g] = byGroup[g] || {v:0, items:[]});
    if(!off.has(t.id)) byGroup[g].v += t.amount;
    byGroup[g].items.push(t);
  });
  const live  = ex.filter(t=>!off.has(t.id));
  const total = live.reduce((a,b)=>a+b.amount,0);
  const tcb   = live.filter(t=>t.src==='tcb').reduce((a,b)=>a+b.amount,0);
  const cc    = live.filter(t=>t.src==='cc').reduce((a,b)=>a+b.amount,0);
  const debts = state.tx.filter(t=>['ccpay','internal','installment'].includes(t.kind) && inMonth(t));
  const income= state.tx.filter(t=>t.kind==='income' && inMonth(t) && !off.has(t.id)).reduce((a,b)=>a+b.amount,0);
  const groups= Object.entries(byGroup).sort((a,b)=>b[1].v-a[1].v);
  return { total, tcb, cc, groups, debts, income, max: groups[0]?.[1].v || 1 };
}

/* ==================================================================
   BÓC CHỮ  — nhận text OCR từ ảnh chụp TCB, trả về danh sách giao dịch
   ================================================================== */
const CHROME = [/^tìm giao dịch$/i,/^lịch sử giao dịch$/i,/^thẻ tín dụng$/i,
  /^số tài khoản$/i,/^nhập tên người nhận$/i,/^hoặc lời nhắn$/i,
  /^tất cả$/i,/^tiền vào$/i,/^tiền ra$/i,/^trả góp ngay$/i,/^ưu đãi$/i,/^xem ngay$/i,
  /bạn có .* giao dịch/i,/chuyển đổi sang trả góp/i,/^\d{1,2}:\d{2}$/,/^\d{1,3}%?$/,
  /^[|·•‹›<>←→\s]*$/];
const pad2 = n => String(n).padStart(2,'0');
function readDate(line, capture){
  const t=line.trim(), d=new Date(capture);
  if(/^hôm nay$/i.test(t)) return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  if(/^hôm qua$/i.test(t)){ d.setDate(d.getDate()-1);
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  let m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return null;
}
function readAmt(line){
  const t=line.trim().replace(/[Oo]/g,'0').replace(/[lI]/g,'1').replace(/\s+/g,' ');
  const m=t.match(/^([+\-−–])?\s?([\d][\d.,\s]{2,})$/); if(!m) return null;
  const dg=m[2].replace(/\D/g,''); if(dg.length<3||dg.length>12) return null;
  return { amount:parseInt(dg,10), sign:(m[1]&&/\+/.test(m[1]))?'+':'-' };
}
function tidy(n){
  n=n.trim().replace(/^[•·\-–—\s]+/,'');
  if(/^Grab\*/i.test(n)) return 'Grab';
  const m=n.match(/^PAYOO[-\s]+([A-Z0-9]+)/i); if(m) return 'Payoo · '+m[1];
  if(/ONLINE MOBILE SERVICES/i.test(n)) return 'MoMo';
  if(/^MOMO_/i.test(n)) return 'MoMo';
  if(/SHOPEEPAY/i.test(n)) return 'ShopeePay';
  if(/^MOCA/i.test(n)) return 'Moca';
  if(/ANTHROPIC/i.test(n)) return 'Anthropic Claude';
  if(/YouTube ?Premium/i.test(n)) return 'YouTube Premium';
  return n.replace(/\s+(US\s+)?APPCODE.*$/i,'').replace(/\s+TID.*$/i,'')
          .replace(/\s+\d{6,}.*$/,'').replace(/[.…]+$/,'').trim();
}
const DESC_PAT = [
  /GD\s+THE/i, /SO\s+THE/i, /APPCODE/i, /^NAP\s+VI/i, /^MBVCB/i, /^CASHIN/i,
  /chuyen\s+tien/i, /chuyen$/i, /thanh\s*toan/i, /^TT\s/i, /^CK\s/i, /^MS\d/i,
  /^VQR/i, /^KOVQR/i, /^\d[\d\s]{8,}$/, /Interest amount/i, /^Doi diem/i,
];
function isDescLine(l){
  const t=l.trim();
  if(DESC_PAT.some(r=>r.test(t))) return true;
  if(/[a-zàáâãèéêìíòóôõùúýăđĩũơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/.test(t)
     && !/^(Tiền|Grab|Payoo|Google|Anthropic)/i.test(t)) return true;
  return false;
}

/* Đọc số dư từ ảnh Trang chủ hoặc màn Thẻ tín dụng.
   Bám vào nhãn đứng cạnh con số, không đoán mò. */
function parseBalance(text){
  const L=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const num=x=>{ const d=String(x).replace(/[Oo]/g,'0').replace(/[^\d]/g,''); 
                 return d.length>=4 ? parseInt(d,10) : null; };
  const out={};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/số dư hiện có/i.test(l)){
      for(let j=i;j<Math.min(i+3,L.length);j++){
        const m=L[j].match(/VND\s*([\d.,]+)/i) || (j>i && L[j].match(/^([\d.,]{7,})$/));
        if(m){ out.tcb=num(m[1]); break; }
      }
    }
    if(/^đã chi tiêu$/i.test(l) && L[i+3]) {           // hàng nhãn rồi hàng số
      out.ccUsed=num(L[i+3]); out.ccInstallment=num(L[i+4]); out.ccAvail=num(L[i+5]);
    }
  }
  return out;
}

function parseShot(text, capture, force){
  const lines=text.split(/\r?\n/);
  const isCC = force==='cc' ? true
             : force==='tcb' ? false
             : (/thẻ tín dụng|trả góp hàng kỳ|chuyển đổi sang trả góp/i.test(text)
                && !/thẻ thanh toán|tìm giao dịch/i.test(text));
  const out=[]; let cur=null, buf=[], pend=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line||CHROME.some(r=>r.test(line))) continue;
    const d=readDate(line,capture); if(d){ cur=d; buf=[]; pend=null; continue; }
    const a=readAmt(line);
    if(a){
      /* Không dựa vào vị trí — phân loại từng dòng trong buffer.
         Dòng mô tả: có chữ thường, hoặc khớp mẫu quen của ngân hàng. */
      const names=[], descs=[];
      for(const b of buf) (isDescLine(b) ? descs : names).push(b);
      out.push({ date:cur, name:tidy(names.join(' ')||descs.join(' ')||'Không rõ'),
                 note:descs.join(' ').replace(/[.…]+$/,''),
                 amount:a.amount, sign:a.sign, src:isCC?'cc':'tcb' });
      buf=[]; continue;
    }
    buf.push(line);
  }
  return out.map(t=>{
    let kind = t.sign==='+' ? 'income' : 'expense';
    const d=(t.note||'').toLowerCase();
    if(/thanh\s*toan\s*no\s*the/.test(d)) kind='ccpay';
    else if(/tra\s*gop\s*hang\s*ky/.test(d)) kind='installment';
    else if(/doi\s*diem/.test(d)) kind='reward';
    else if(t.name.toUpperCase()==='DANG HOANG LONG') kind='internal';
    if(/^(DANG HOANG LONG chuyen|MS\d|CASHIN|Giao dich thanh toan|GD THE|NAP VI|MBVCB)/i.test(t.note))
      t.note='';
    return {...t, kind};
  });
}

    const gap = d.real - d.expect;
    return `<div class="card" style="border-left:2px solid ${C.negative}">
      <h4>Số dư không khớp với giao dịch đã ghi</h4>
      <div class="v num" style="color:${C.negative}">${gap>0?'+':''}${fmt(gap)} ₫</div>
      <p>Từ ${d.from.slice(8)}/${d.from.slice(5,7)} đến ${d.to.slice(8)}/${d.to.slice(5,7)},
      theo giao dịch thì số dư phải là ${fmt(d.expect)} ₫, ngân hàng báo ${fmt(d.real)} ₫.
      ${gap<0?'Có thể còn giao dịch chưa nhập.':'Có thể nhập trùng hoặc thiếu khoản tiền vào.'}</p>
      <div style="display:flex;gap:9px;margin-top:${S.sm}px">
        <button class="btn ghost" style="flex:1" data-drift="clear">Bỏ qua</button>
        <button class="btn" style="flex:1" data-tab="import">Nhập thêm</button>
      </div>
    </div>`;
  },

  offset(){
    const seen = state.pairSeen || {};
    const pairs = offsetPairs().filter(([a,b])=>!seen[a.id+'|'+b.id]);
    if(!pairs.length) return '';
    return `<div class="card" style="border-left:2px solid ${C.positive}">
      <h4>Ứng rồi được trả lại — đã trừ khỏi chi tiêu ${noteIcon('offset')}</h4>
      ${pairs.map(([a,b])=>`<div class="rowline"><span>${a.name}</span>
        <span class="num">${fmt(a.amount)} ₫</span></div>`).join('')}
      ${noteBody('offset',`Cùng tên, cùng số tiền, ngược chiều trong ${OFFSET_DAYS} ngày. ${state.keepPairs?'Đang tính vào chi tiêu.':'Đang bỏ qua cả hai chiều.'}`)}
      <div style="display:flex;gap:9px;margin-top:${S.sm}px">
        <button class="btn ghost" style="flex:1" data-keeppairs="1">${
          state.keepPairs?'Bỏ qua chúng':'Tính vào chi tiêu'}</button>
        <button class="btn" style="flex:1" data-pairseen="1">Đúng rồi, ẩn đi</button>
      </div>
    </div>`;
  },

  debtLine(){
    const L = loanState();
    const total = BAL().ccUsed + BAL().ccInstallment + L.balance;
    return `<div class="card" style="margin-top:${S.lg}px">
      <h4>Tổng đang nợ</h4>
      <div class="v num">${fmt(total)} <span style="font-size:12px;color:${C.muted}">₫</span></div>
      <div class="s">Thẻ ${fmt(BAL().ccUsed+BAL().ccInstallment)} · vay SC ${fmt(L.balance)}</div>
    </div>`;
  },

  groups(s){ return `<div class="bars">` + s.groups.map(([g,d])=>`
    <div class="bar${state.open[g]?' open':''}" data-g="${g}">
      <div class="top" data-toggle="${g}">
        <span class="nm"><em>›</em>${g}</span>
        <span class="rt"><b class="num">${fmt(d.v)} ₫</b><span class="dlt">–</span></span>
      </div>
      <div class="track"><i style="width:${(d.v/s.max*100).toFixed(1)}%"></i></div>
      <div class="detail">${d.items.slice().sort((a,b)=>b.amount-a.amount).map(t=>`
        <div class="tx"><span class="l"><b>${t.name}</b>
          <span class="num">${t.date.slice(8)}/${t.date.slice(5,7)}${t.note?' · '+t.note:''}${t.src==='cc'?' · thẻ':''}</span></span>
          <span class="r num">${fmt(t.amount)}</span></div>`).join('')}</div>
    </div>`).join('') + `</div>`;
  },

  recon(s){
    const out = s.tcb + s.debts.reduce((a,b)=>a+b.amount,0) - s.income;
    return `<div class="card"><h4>Đối chiếu số dư</h4>
      <div class="v num">${fmt(out)} <span style="font-size:12px;color:${C.muted}">₫</span></div>
      <p>Số tiền phải rời khỏi tài khoản TCB trong kỳ. So với chênh lệch số dư thật để biết còn sót giao dịch nào không.</p>
    </div>`;
  },

  debtPaid(s){ return `<div class="card"><h4>Trả nợ &amp; chuyển khoản — không tính chi tiêu ${noteIcon('debt')}</h4>
    ${s.debts.map(t=>`<div class="rowline"><span>${t.name}</span>
      <span class="num">${fmt(t.amount)} ₫</span></div>`).join('')}
    ${noteBody('debt','Tiền rời tài khoản nhưng không phải chi tiêu mới — phần lớn là trả những khoản đã tiêu trước đó.')}</div>`;
  },

  pending(){
    const n = state.tx.filter(t=>t.kind==='expense' && !state.done[t.id]).length;
    if (!n) return '';                       // duyệt hết rồi thì ẩn luôn
    const pick = state.tx.filter(t=>t.kind==='expense' && !state.done[t.id] && !groupOf(t)).length;
    return `<div class="prompt"><p>Chờ duyệt<small>${n} giao dịch${
      pick ? ` · ${pick} chưa có nhóm` : ''}</small></p>
      <button class="btn" data-tab="review">Duyệt</button></div>`;
  },

  card(){ const used = BAL().ccUsed, inst = BAL().ccInstallment;
    return `<div class="card accent"><h4>Dư nợ thẻ đang phát sinh ${noteIcon('card')}</h4>
      <div class="v num">${fmt(used)} <span style="font-size:12px;color:${C.muted}">₫</span></div>
      ${noteBody('card',`Hạn mức ${fmt(CARD.limit)} ₫ · đã dùng ${Math.round((used+inst)/CARD.limit*100)}%. Sao kê chốt ngày ${CARD.statementDay}, hạn trả ngày ${CARD.dueDay}.`)}</div>`;
  },

  installment(){ const inst = BAL().ccInstallment;
    return `<div class="card neg"><h4>Trả góp trên thẻ ${noteIcon('inst')}</h4>
      <div class="v num">${fmt(inst)} <span style="font-size:12px;color:${C.muted}">₫</span></div>
      ${noteBody('inst',`4 gói chuyển đổi 26/08, mỗi gói 3 kỳ, còn 2 kỳ. Mỗi kỳ trừ ${fmt(3343139)} ₫, hết vào tháng 11/2026.`)}</div>`;
  },

  loan(){ const L = loanState();
    return `<div class="card pos"><h4>Khoản vay Standard Chartered ${noteIcon('loan')}</h4>
      <div class="v num">${fmt(L.balance)} <span style="font-size:12px;color:${C.muted}">₫</span></div>
      <p>Kỳ ${L.paid}/${LOAN.months} · còn ${L.left} kỳ · hết nợ ${L.endDate.getMonth()+1}/${L.endDate.getFullYear()}.</p>
      <div class="rowline" style="margin-top:${S.sm}px"><span>Kỳ này là chi phí (lãi)</span>
        <span class="num">${fmt(L.interest)} ₫</span></div>
      <div class="rowline"><span>Kỳ này là giảm nợ (gốc)</span>
        <span class="num" style="color:${C.positive}">${fmt(L.principalPart)} ₫</span></div>
      ${noteBody('loan',`Chuyển đều ${fmt(LOAN.transferAmount)} ₫ ngày 5 hàng tháng. Chỉ phần lãi tính vào chi tiêu, phần gốc chuyển sang giảm nợ.`)}</div>`;
  },

  balances(){ const m = SEED.months['2026-09'];
    return `<h3 class="sec">Số dư</h3>
      <div class="field"><label>Đầu tháng 9</label><span class="val num">${fmt(m.opening)} ₫</span></div>
      <div class="field"><label>Hiện tại</label><span class="val num">${fmt(BAL().tcb)} ₫</span></div>
      <div class="field"><label>Cuối tháng</label><span class="val empty">chưa chốt</span></div>`;
  },

  incomes(){
    const off = offsetIds();
    const list = state.tx.filter(t=>t.kind==='income' && inMonth(t) && !off.has(t.id))
                         .sort((a,b)=>b.amount-a.amount);
    const sum = list.reduce((a,b)=>a+b.amount,0);
    return `<h3 class="sec">Tiền vào tháng ${Number(state.month.slice(5))} ${noteIcon('salary')}</h3>
      ${list.length ? list.map(t=>`<div class="field">
          <label>${t.name}${t.note?' · '+t.note:''}</label>
          <span class="val num" style="color:${C.positive}">${fmt(t.amount)} ₫</span></div>`).join('')
        : `<div class="field"><label>Chưa có khoản nào</label>
           <span class="val empty">–</span></div>`}
      ${list.length?`<div class="field"><label><b style="font-weight:500">Tổng</b></label>
        <span class="val num">${fmt(sum)} ₫</span></div>`:''}
      ${noteBody('salary','Lương về ngày đi làm cuối tháng nên luôn nằm đúng tháng của nó.')}`;
  },

  accounts(){ const L = loanState();
    return `<h3 class="sec">Tài khoản</h3>
      <div class="rowline"><span>Techcombank</span><span class="num">${fmt(BAL().tcb)} ₫</span></div>
      <div class="rowline"><span>Thẻ tín dụng</span>
        <span class="num" style="color:${C.negative}">− ${fmt(BAL().ccUsed+BAL().ccInstallment)} ₫</span></div>
      <div class="rowline"><span>Standard Chartered</span>
        <span class="num" style="color:${C.negative}">− ${fmt(L.balance)} ₫</span></div>
      <div class="rowline" style="border-bottom:1px solid ${C.line}"><span><b style="font-weight:500">Tài sản ròng</b></span>
        <span class="num" style="color:${C.text}">${fmt(BAL().tcb - BAL().ccUsed - BAL().ccInstallment - L.balance)} ₫</span></div>`;
  },
};

function reviewScreen(){
  const list = state.tx.filter(t=>t.kind==='expense' && !state.done[t.id]);
  if (!list.length) return `<p class="eyebrow">Duyệt</p>
    <div class="hero num" style="font-size:26px">Xong rồi</div>
    <p class="hint" style="margin-top:${S.md}px">Lần chụp sau, những tên đã gán sẽ tự vào nhóm cũ.</p>`;
  return `<p class="eyebrow">Từ ảnh chụp 09/09</p>
    <div class="hero num" style="font-size:26px">${list.length} giao dịch</div>
    <div class="rev">` + list.map(t=>{
      const g = groupOf(t);
      const cls = state.group[t.id] ? 'set' : (g ? 'auto' : 'ask');
      const label = g || 'Chọn nhóm';
      const why = state.group[t.id] ? 'đã sửa'
        : (t.name==='Grab' ? (g ? 'đoán theo số tiền' : 'xe hay đồ ăn?') : (g ? 'đã nhớ' : 'lần đầu gặp'));
      return `<div class="row">
        <div class="body"><div class="nm">${t.name}</div>
          <div class="dt num">${t.date.slice(8)}/${t.date.slice(5,7)} · ${t.src==='cc'?'CREDIT':'DEBIT'}${t.note?' · '+t.note:''}</div>
          <div class="chip ${cls}" data-chip="${t.id}"><b>${label}</b> · ${why}</div>
        </div>
        <div class="amt"><span class="num">${fmt(t.amount)}</span>
          <span class="flag${state.flag[t.id]?' on':''}" data-flag="${t.id}">⚑</span>
          ${t.id.startsWith('i')?`<span class="flag" data-del="${t.id}"
            style="color:${C.negative};opacity:.6">✕</span>`:''}</div>
      </div>
      ${state.picker===t.id ? pickerHTML(t, true) : ''}`;
    }).join('') + `</div>
    <p class="hint">Chạm nhóm để đổi · chạm ⚑ đánh dấu bất thường</p>
    <div style="display:flex;gap:9px;margin-top:${S.md}px">
      <button class="btn ghost" style="flex:1" data-tab="overview">Để sau</button>
      <button class="btn" style="flex:1" data-approve="1">Duyệt tất cả</button>
    </div>`;
}


function importScreen(){
  const r = state.imp || {};
  return `<p class="eyebrow">Nhập dữ liệu</p>
    <div class="hero num" style="font-size:26px">${r.rows?`${r.rows.length} giao dịch`:'Dán chữ từ ảnh'}</div>
    <p class="hint" style="text-align:left;margin-top:${S.sm}px">
      ${noteBody('howto','Mở ảnh chụp trong Ảnh → chạm giữ chọn chữ → Sao chép → dán vào ô dưới. Hoặc chọn nhiều ảnh rồi chia sẻ vào Shortcut Dòng Tiền.')}</p>
    <h3 class="sec">Ảnh này chụp từ đâu</h3>
    <div class="picker" style="border:none;padding-left:0">
      ${[['auto','Tự nhận'],['tcb','Tài khoản'],['cc','Thẻ tín dụng']].map(([v,l])=>
        `<button data-src="${v}" class="${(state.impSrc||'auto')===v?'cur':''}">${l}</button>`).join('')}
    </div>
    <textarea id="imp" placeholder="Dán vào đây..." style="width:100%;min-height:120px;
      margin-top:${S.md}px;background:${C.surface};color:${C.text};border:1px solid ${C.line};
      border-radius:${R.sm}px;padding:${S.sm}px;font:300 12px/1.5 ${THEME.font.family};
      resize:vertical">${r.raw||''}</textarea>
    <div style="display:flex;gap:9px;margin-top:${S.sm}px">
      <button class="btn ghost" style="flex:1" data-imp="clear">Xoá ô</button>
      <button class="btn" style="flex:1" data-imp="parse">Bóc thử</button>
    </div>
    ${dupExtras().length ? `
      <div class="card" style="border-left:2px solid ${C.negative}">
        <h4>Có bản ghi trùng trong sổ</h4>
        <div class="v num">${dupExtras().length} dòng</div>
        ${dupExtras().slice(0,6).map(t=>`<div class="rowline"><span>${t.name}</span>
          <span class="num">${fmt(t.amount)} ₫</span></div>`).join('')}
        <p>Cùng ngày, cùng số tiền, cùng nguồn với một dòng đã có.
        <button data-imp="dedupe" style="color:${C.negative};border-bottom:1px solid ${C.line}">Dọn ngay</button></p>
      </div>` : ''}
    ${state.tx.filter(t=>t.id.startsWith('i')).length ? `
      ${(()=>{ const n=state.tx.filter(t=>t.id.startsWith('i')).length;
        if(state.impAck>=n) return '';
        const last=state.tx.filter(t=>t.batch===state.lastBatch).length;
        return `<div class="card" style="margin-top:${S.lg}px">
          <h4>Đã nhập ${n} giao dịch từ ảnh ${noteIcon('imp')}</h4>
          ${noteBody('imp','Kiểm ở tab Duyệt xem đúng chưa. Sai thì hoàn tác lần nhập vừa rồi, hoặc xoá từng dòng bằng nút ✕.')}
          <div style="display:flex;gap:9px;margin-top:${S.sm}px">
            ${last?`<button class="btn ghost" style="flex:1" data-imp="undo">Hoàn tác ${last} dòng vừa nhập</button>`:''}
            <button class="btn" style="flex:1" data-imp="ack">Đúng rồi</button>
          </div>
          <p style="margin-top:${S.sm}px;font-size:11px;color:${C.faint}">
            ${state.confirmWipe
              ? `Xoá toàn bộ ${n} giao dịch đã nhập? <button data-imp="wipe" style="color:${C.negative};border-bottom:1px solid ${C.negative}">Xoá thật</button> · <button data-imp="nowipe" style="color:${C.faint};border-bottom:1px solid ${C.line}">thôi</button>`
              : `<button data-imp="askwipe" style="color:${C.faint};border-bottom:1px solid ${C.line}">xoá hết và nhập lại từ đầu</button>`}</p>
        </div>`; })()}` : ''}
    ${r.bal && r.bal.tcb ? `
      <div class="card" style="border-left:2px solid ${C.positive}">
        <h4>Tìm thấy số dư trong ảnh ${noteIcon('bal')}</h4>
        ${noteBody('bal','App không hiện số dư, chỉ dùng nó để kiểm xem có giao dịch nào chụp sót không.')}
        <button class="btn" style="width:100%;margin-top:${S.sm}px" data-imp="setbal">Dùng để đối chiếu</button>
      </div>` : ''}
    ${r.rows ? `
      ${r.rows.some(t=>t.noDate) ? `<div class="card" style="border-left:2px solid ${C.negative}">
        <h4>${r.rows.filter(t=>t.noDate).length} dòng không có ngày</h4>
        <p>Ảnh bị cắt mất tiêu đề ngày ở phía trên. Mấy dòng này sẽ không được nhập —

          :(t.new?'':' <span style="color:'+C.faint+'">· đã có</span>')}</span>

function render(){
  const prev = document.querySelector('main');
  const keepScroll = prev ? prev.scrollTop : 0;
  const s = summary();
  const body =
    state.tab==='overview' ? LAYOUT.overview.map(b=>blocks[b](s)).join('') :
    state.tab==='review'   ? reviewScreen() :
    state.tab==='import'   ? importScreen() :
    state.tab==='debt'     ? `<p class="eyebrow">Nợ &amp; trả góp</p>
        <div class="hero num" style="font-size:26px">${fmt(BAL().ccUsed+BAL().ccInstallment+loanState().balance)}<i>₫</i></div>
        ${LAYOUT.debt.map(b=>blocks[b](s)).join('')}` :
    `<p class="eyebrow">Nhập theo tháng</p><div class="hero num" style="font-size:26px">Tháng 9</div>
     ${LAYOUT.month.map(b=>blocks[b](s)).join('')}`;

  document.getElementById('app').innerHTML = `<style>${css()}</style>
    <div class="phone">
      <header>
        <div class="brand">Dòng <span>Tiền</span>
          <span style="font-size:9px;color:${C.faint};font-weight:300">${BUILD}</span></div>
        <div class="hd-right">
          <button data-month="1" style="color:${C.muted}">Tháng ${Number(state.month.slice(5))}, ${state.month.slice(0,4)} ⌄</button>
          <br><span id="sync" style="font-size:10px;color:${C.faint}">…</span>
          ${_uid?'':`<br><button onclick="dtLogin()" style="font-size:10px;color:${C.accent};border-bottom:1px solid ${C.line}">Đăng nhập Google</button>`}
        </div>
      </header>
      <main>${body}</main>
      <div><nav>${LAYOUT.tabs.map(t=>`<button data-tab="${t.id}" class="${state.tab===t.id?'on':''}">
        <i>${t.icon}</i>${t.label}</button>`).join('')}</nav><div class="homebar"></div></div>
    </div>`;
  const m = document.querySelector('main');
  if (m && !state.resetScroll) m.scrollTop = keepScroll;
  state.resetScroll = false;
  bind();
}

function bind(){
  const $ = q => [...document.querySelectorAll(q)];
  $('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
  $('[data-month]').forEach(b=>b.onclick=()=>{
    const i=MONTHS.indexOf(state.month);
    state.month=MONTHS[(i+1)%MONTHS.length]; save(); render(); });
  $('[data-note]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    state.noteOpen = state.noteOpen===b.dataset.note ? null : b.dataset.note;
    render(); });
  $('[data-toggle]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.toggle; state.open[g]=!state.open[g]; render(); });
  $('[data-chip]').forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    const id=c.dataset.chip;
    state.picker = state.picker===id ? null : id; render(); });
  $('[data-cycle]').forEach(r=>r.onclick=e=>{
    e.stopPropagation();
    const id=r.dataset.cycle;
    state.picker = state.picker===id ? null : id; render(); });
  $('[data-set]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [id,g,now]=b.dataset.set.split('|');
    if (now){ state.group[id]=g; state.picker=null; save(); render(); return; }
    if (groupOf(state.tx.find(x=>x.id===id))===g) delete state.pending[id];
    else state.pending[id]=g;
    render(); });
  $('[data-save]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.dataset.save;
    state.group[id]=state.pending[id];
    delete state.pending[id]; state.picker=null; save(); render(); });
  $('[data-del]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    state.tx = state.tx.filter(t=>t.id!==b.dataset.del);
    save(); render(); });
  $('[data-drift]').forEach(b=>b.onclick=()=>{ state.drift=null; save(); render(); });
  $('[data-pairseen]').forEach(b=>b.onclick=()=>{
    state.pairSeen = state.pairSeen || {};
    offsetPairs().forEach(([a,c])=>{ state.pairSeen[a.id+'|'+c.id]=true; });
    save(); render(); });
  $('[data-keeppairs]').forEach(b=>b.onclick=()=>{
    state.keepPairs=!state.keepPairs; save(); render(); });
  $('[data-flag]').forEach(f=>f.onclick=e=>{
    e.stopPropagation();
    const id=f.dataset.flag; state.flag[id]=!state.flag[id]; save(); render(); });
  $('[data-src]').forEach(b=>b.onclick=()=>{
    const box=document.getElementById('imp');
    state.imp = state.imp ? {...state.imp, raw:(box?box.value:state.imp.raw)} : null;
    state.impSrc = b.dataset.src; render(); });
  $('[data-imp]').forEach(b=>b.onclick=()=>{
    const box=document.getElementById('imp');
    const act=b.dataset.imp;
    if(act==='clear'){ state.imp=null; render(); return; }
    if(act==='setbal'){
      const now = new Date().toISOString().slice(0,10);
      const nb  = { ...(state.imp.bal||{}) }; delete nb.ccAvail;
      const old = state.bal;
      let drift = null;
      if(old && old.asOf && nb.tcb!=null && old.tcb!=null){
        /* Số dư dự kiến = số dư lần trước + thu - chi qua TCB trong khoảng giữa hai lần */
        const between = t => t.date > old.asOf && t.date <= now && t.src==='tcb';
        let flow = 0;
        state.tx.filter(between).forEach(t=>{
          if(t.kind==='income') flow += t.amount;
          else flow -= t.amount;            // chi, trả nợ, chuyển nội bộ đều là tiền ra
        });
        const expect = old.tcb + flow;
        if(Math.abs(expect - nb.tcb) >= 1000) drift = { expect, real: nb.tcb, from: old.asOf, to: now };
      }
      state.bal = { ...(state.bal||{}), ...nb, asOf: now };
      state.drift = drift;
      state.imp = null;
      save(); render(); return;
    }
    if(act==='dedupe'){
      const bad=new Set(dupExtras().map(t=>t.id));
      state.tx=state.tx.filter(t=>!bad.has(t.id));
      save(); render(); return;
    }
    if(act==='ack'){ state.impAck=state.tx.filter(t=>t.id.startsWith('i')).length; save(); render(); return; }
    if(act==='undo'){
      state.tx=state.tx.filter(t=>t.batch!==state.lastBatch);
      state.lastBatch=null; save(); render(); return;
    }
    if(act==='askwipe'){ state.confirmWipe=true; render(); return; }
    if(act==='nowipe'){ state.confirmWipe=false; render(); return; }
    if(act==='wipe'){
      state.confirmWipe=false;
      state.tx = state.tx.filter(t=>!t.id.startsWith('i'));
      state.imp=null; save(); render(); return;
    }
    if(act==='parse'){
      const raw=box.value;
      const rows=parseShot(raw, new Date().toISOString().slice(0,10), state.impSrc||'auto');
      /* So theo ngày + số tiền + nguồn, đếm số lượng.
         Tên không dùng để so vì OCR và dữ liệu cũ viết khác nhau,
         nhưng vẫn cho phép hai giao dịch trùng tiền thật trong cùng ngày. */
      const key=t=>t.date+'|'+t.amount+'|'+t.src;
      const have={};
      state.tx.forEach(t=>{ have[key(t)]=(have[key(t)]||0)+1; });
      let dup=0;
      rows.forEach(t=>{
        if(!t.date){ t.new=false; t.noDate=true; return; }   // thiếu ngày → không nhập
        const k=key(t);
        if((have[k]||0) > 0){ have[k]--; t.new=false; dup++; }
        else { t.new=true; }
      });
      state.imp={ raw, rows, dup, bal:parseBalance(raw) }; render(); return;
    }
    if(act==='commit'){
      const add=(state.imp.rows||[]).filter(t=>t.new);
      const batch='b'+Date.now();
      add.forEach((t,i)=>state.tx.push({ id:'i'+Date.now()+i, batch, date:t.date, name:t.name,
        note:t.note, amount:t.amount, src:t.src, kind:t.kind }));
      state.lastBatch = add.length ? batch : state.lastBatch;
      state.impAck = 0;
      state.imp=null; state.tab='review'; save(); render();
    }
  });
  $('[data-approve]').forEach(b=>b.onclick=()=>{
    state.tx.filter(t=>t.kind==='expense').forEach(t=>{
      if (groupOf(t)) state.done[t.id]=true; });
    save(); render(); });
}

render();
</script>
</body>
</html>
